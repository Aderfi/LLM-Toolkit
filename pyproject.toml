[project]
name = "llmtools"
version = "0.2.0"
description = "Tools for a local LLM agent (Ollama / llama.cpp, OpenAI-compatible tool calling)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.1",
    "httpx>=0.27",
    "requests>=2.31",
    "feedparser>=6.0",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "playwright>=1.48",
    "google-news-api>=0.1.1",
    "tzlocal>=5.0",
]

[project.optional-dependencies]
# Secondary tools (imported only when used).
tools = [
    "sympy>=1.13",
    "pint>=0.24",
    "polars>=1.0",
    "fastexcel>=0.11",
    "xlsxwriter>=3.2",
    "pyperclip>=1.9",
    "imap-tools>=1.7",
    "icalendar>=6.0",
    "python-frontmatter>=1.1",
    "pymupdf>=1.24",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "tabulate>=0.9",
    "pillow>=10.0",
    "qrcode>=7.4",
    "mss>=9.0",
    "psutil>=6.0",
    "graphviz>=0.20",
    "mermaid-py>=0.5",
    "google-api-python-client>=2.140",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
audio = [
    "av<19",  # faster-whisper 1.2.x passes metadata_errors, removed in PyAV 19
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
# Heavy: RAG, OCR, YouTube, translation. OCR also needs `apt install tesseract-ocr tesseract-ocr-spa`.
extra = [
    "sentence-transformers>=2.7",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "youtube-transcript-api>=0.6",
    "argostranslate>=1.9",
]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
]

[project.scripts]
llmtools = "llmtools.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
